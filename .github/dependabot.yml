# Keeps dependencies current across the fleet.
#
# Minor and patch bumps are grouped into a single PR per ecosystem per week, so
# routine drift costs one review rather than twenty. Majors still arrive as
# their own PRs, because they need reading.
#
# Deliberately no `ignore:` rules — an ignore also suppresses the *security*
# update for that dependency, which is exactly the PR worth having.
# The exception is the npm `ignore:` below: majors that cannot install yet.
# It holds the major only, so patches to the current line still come through.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/launcher"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Majors that cannot install yet (checked 2026-10-22). Each one fails `npm ci`
    # with ERESOLVE, so its PR could never go green. Delete a line once its
    # blocker lifts and Dependabot offers the major again.
    ignore:
      # typescript-eslint 8.72 peers typescript <6.1.0, so TypeScript 7 is out
      # until it widens that range.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react 7.37.5 peers eslint ^9.7 at most, so eslint 10 is out
      # until a release accepts it.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # @electron-toolkit/eslint-config-ts 4 brings @eslint/js 10, which peers
      # eslint ^10: held for the same reason as eslint.
      - dependency-name: "@electron-toolkit/eslint-config-ts"
        update-types: ["version-update:semver-major"]
    groups:
      # Peer-locked families move together, whatever the bump size. A major that
      # arrives for one member without the others is how react 19 shipped against
      # react-dom 18 and took a hosted app down for three weeks (RFutils #22).
      # These sit ABOVE the minor-and-patch group because Dependabot files a
      # dependency under the first group that matches it.
      react-family:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "react-refresh"]
        update-types: ["major", "minor", "patch"]
      vite-toolchain:
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*", "esbuild", "electron-vite", "rolldown", "rolldown-vite"]
        update-types: ["major", "minor", "patch"]
      eslint-typescript:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "eslint-config-*", "typescript-eslint", "@typescript-eslint/*", "typescript"]
        update-types: ["major", "minor", "patch"]
      electron-family:
        patterns: ["electron", "electron-builder", "@electron/*", "@electron-forge/*"]
        update-types: ["major", "minor", "patch"]
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directories:
      - "/launcher/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Peer-locked families move together, whatever the bump size (see the npm
      # entries for why). wgpu/egui/eframe/winit only compile against matching
      # majors; tauri and its plugins likewise.
      gpu-ui-family:
        patterns: ["wgpu", "wgpu-*", "egui", "egui-*", "eframe", "winit"]
        update-types: ["major", "minor", "patch"]
      tauri-family:
        patterns: ["tauri", "tauri-*"]
        update-types: ["major", "minor", "patch"]
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
