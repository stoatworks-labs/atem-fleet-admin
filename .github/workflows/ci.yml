name: ci

# Typecheck / lint / test on every push and PR — separate from release.yml,
# which only builds installers on a version tag.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  atem-fleet-admin:
    name: atem-fleet-admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lockfile matches manifest

        run: npm ls --all >/dev/null

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build the static site

        run: npm run static:build

      # Loads the built site in a real browser: a React major mismatch builds green

      # and throws on first render (RFutils #22, three weeks of an empty page).

      - name: Smoke-check the built site

        uses: stoatworks-labs/smoke-check@v1

        with:

          dir: out-static
