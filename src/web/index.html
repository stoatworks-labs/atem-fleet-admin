<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATEM Fleet Admin</title>
    <meta name="description" content="Provision a whole fleet of Blackmagic ATEM switchers at once, in a browser. Model-aware configuration forms export loadable XML plus a media folder, or apply the settings live over the network.">
    <link rel="canonical" href="https://atem-fleet-admin.stoatworks-labs.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Stoatworks Labs">
    <meta property="og:locale" content="en_GB">
    <meta property="og:url" content="https://atem-fleet-admin.stoatworks-labs.com/">
    <meta property="og:title" content="ATEM Fleet Admin">
    <meta property="og:description" content="Provision a whole fleet of Blackmagic ATEM switchers at once, in a browser. Model-aware configuration forms export loadable XML plus a media folder, or apply the settings live over the network.">
    <!-- Card hosted on the main site: it is regenerated in place by the
         website's make_thumbnails.py and keeps its filename, so a copy
         vendored here would go stale without anything saying so. -->
    <meta property="og:image" content="https://stoatworks-labs.com/thumbs/atem-fleet-admin-web.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="720">
    <meta property="og:image:alt" content="ATEM Fleet Admin">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://stoatworks-labs.com/thumbs/atem-fleet-admin-web.png">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
    <!--
      About dialog. Both files are vendored from stoatworks-backend/about and
      generated by its sync-about.py — edit them there, never here. Classic +
      defer: about-data.js only sets defaults, so it and the app's own startup
      can load in either order.
    -->
    <script src="/about-data.js" defer></script>
    <script src="/about.js" defer></script>
    <!--
      Support footer. Vendored from stoatworks-backend/support-footer — edit it
      there and re-run that repo's scripts/sync-support-footer.sh, never here.
      Classic + defer on purpose: it reads its config off this tag, and
      document.currentScript is null inside a module.

      No data-note, for the same reason RFutils has none: this index.html is the
      root of BOTH web builds — the hosted static one, which has no backend and
      does everything in the tab, and the server-backed one behind src/server.
      "Nothing is uploaded" would be true of the first and false of the second.
    -->
    <script
      src="/support-footer.js"
      defer
      data-app="ATEM Fleet Admin"
      data-repo="https://github.com/stoatworks-labs/atem-fleet-admin"
    ></script>
  </body>
</html>
