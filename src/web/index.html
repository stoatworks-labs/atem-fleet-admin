  <body>
    <noscript>
      <h1>ATEM Fleet Admin</h1>
      <p>Set up a whole fleet of ATEM switchers in one go. Model-aware forms export a loadable XML and a media folder for each one, so you're not doing them one at a time on a flight case at 02:00.</p>
      <p>This is the hosted build, with no install and no backend. Every ATEM profile is generated in your own tab by the same code the desktop app runs, and the export arrives as a .zip of the identical folder tree. Nothing is uploaded. Connecting to a switcher and applying the settings live needs the desktop app, because a web page can't open a socket to a switcher on your network.</p>
      <p>It needs JavaScript to run.</p>
      <ul>
        <li><a href="https://stoatworks-labs.com/web-tools/atem-fleet-admin/">ATEM Fleet Admin on Stoatworks Labs</a></li>
        <li><a href="https://stoatworks-labs.com/software/atem-fleet-admin/">Project page</a></li>
        <li><a href="https://stoatworks-labs.com/software/atem-fleet-admin/guide/">User guide</a></li>
        <li><a href="https://github.com/stoatworks-labs/atem-fleet-admin">Source code on GitHub</a></li>
      </ul>
    </noscript>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
    <!--
      About dialog. Both files are vendored from stoatworks-backend/about and
      generated by its sync-about.py — edit them there, never here. Classic +
      defer: about-data.js only sets defaults, so it and the app's own startup
      can load in either order.
    -->
    <script src="/about-data.js" defer></script>
    <script src="/about.js" defer></script>
    <!--
      Support footer. Vendored from stoatworks-backend/support-footer — edit it
      there and re-run that repo's scripts/sync-support-footer.sh, never here.
      Classic + defer on purpose: it reads its config off this tag, and
      document.currentScript is null inside a module.

      No data-note, for the same reason RFutils has none: this index.html is the
      root of BOTH web builds — the hosted static one, which has no backend and
      does everything in the tab, and the server-backed one behind src/server.
      "Nothing is uploaded" would be true of the first and false of the second.
    -->
    <script
      src="/support-footer.js"
      defer
      data-app="ATEM Fleet Admin"
      data-repo="https://github.com/stoatworks-labs/atem-fleet-admin"
    ></script>
